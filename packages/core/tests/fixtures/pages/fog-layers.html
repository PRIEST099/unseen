<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>layers under and over text, for The Fog</title>
<style>
  body { margin: 0; }
  .stage { position: relative; height: 60px; background: rgb(0, 0, 0); margin: 8px 0; }
  .stage > .layer { position: absolute; inset: 0; pointer-events: none; }
  .stage > p { position: relative; margin: 0; color: rgb(255, 255, 255); }
  .row { display: flex; }
  .row > div { flex: 1; padding: 4px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Layers</h1>
  <p id="plain" style="color: rgb(119, 119, 119)">no background anywhere: the white fallback applies</p>
  <div class="stage">
    <svg class="layer" id="svg-layer" width="100%" height="100%"><rect width="100%" height="100%" fill="rgb(200, 30, 30)"></rect></svg>
    <p id="over-svg">text over a positioned sibling svg</p>
  </div>
  <div class="stage">
    <div class="layer" id="gradient-layer" style="background: linear-gradient(rgb(255, 255, 255), rgb(0, 0, 0))"></div>
    <p id="over-gradient">text over a positioned sibling gradient</p>
  </div>
  <div class="stage">
    <p id="over-nothing">text on plain black, nothing else under it</p>
  </div>
  <div class="row">
    <div style="background: rgb(20, 20, 20); color: rgb(255, 255, 255)"><span id="left">left block, own background</span></div>
    <div style="background: rgb(240, 240, 240); color: rgb(0, 0, 0)"><span id="right">right block, own background</span></div>
  </div>
  <div style="opacity: 0"><p id="faded" style="color: rgb(255, 255, 255)">text inside an opacity 0 container</p></div>
</main>
</body>
</html>
