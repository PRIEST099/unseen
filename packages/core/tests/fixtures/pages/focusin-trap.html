<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>focusin focus trap, document level</title>
<style>
  input { outline: none; background: rgb(255, 255, 255); }
  input:focus { outline: 2px solid rgb(0, 0, 255); }
</style>
</head>
<body>
<main>
  <h1>Focusin trap</h1>
  <a href="#before">before</a>
  <div id="dlg" role="dialog" aria-modal="true" aria-label="Dialog">
    <input id="email" aria-label="email">
    <button id="ok">ok</button>
  </div>
  <a href="#after">after</a>
</main>
<script>
  // The pattern of checkout.html and focus-trap libraries: any focus outside the dialog goes back in.
  const dlg = document.getElementById('dlg'), email = document.getElementById('email')
  email.focus()
  document.addEventListener('focusin', (e) => { if (!dlg.contains(e.target)) email.focus() })
</script>
</body>
</html>
